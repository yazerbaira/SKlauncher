# New Alerts
alert.duplicate.window.title=Babala sa Duplikang Istansya
alert.duplicate.label.title=Meron ka nang istansya ng Minecraft na tumatakbo.
alert.duplicate.label.body=Kung ilulunsad mo pa ang isang kopya sa parehong direktoryo, maaari silang magkasalungat at masira ang iyong mga save. \nMaaari itong magdulot ng maraming problema, sa singleplayer o iba pa.  Hindi kami mananagot sa anumang mangyari. \nGusto mo pa bang magsimula ng isa pang instance ng Minecraft, sa kabila nito? \nMaaari mong malutas ang problemang ito sa pamamagitan ng paglulunsad ng laro sa ibang direktoryo (tingnan ang buton na "I-Edit ang Instalasyon").

alert.downgrade.window.title=Babala sa mga Di-Magkatugmang Instalasyon
alert.downgrade.label.title=Ibalik sa dati ang mga Instalasyon?
alert.downgrade.label.body=Parang gumamit ka ng ibang launcher bukod dito! \nKung ika'y babalik ka sa paggamit nito, kailangan naming ibalik sa dati ang pagsasayos ng launcher mo.  
alert.downgrade.button.reset=Sigurado ako. Ibalik sa dati.
alert.downgrade.button.cancel=Di bale, isara nalang ang launcher na ito

alert.invalid.window.title=Babala sa mga Di-wastong Bersyon
alert.invalid.label.title=Nakahanap ng mga imbalidong bersyon :(
alert.invalid.label.body=Ang mga sumusunod na bersyon ay di-wasto at di-maikarga. \nPaalala: Hindi namin sinusuportahan ang ilang mga bersyong dinownload mula sa mga ibang launcher.
